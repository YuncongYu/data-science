name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --group dev --locked

      - name: Lint
        run: |
          uv run ruff check .

      - name: Format Check
        run: |
          uv run ruff format --check .

      - name: Type Check
        run: |
          uv run mypy .

      - name: Unit Test
        run: |
          uv run pytest

      - name: Coverage
        run: |
          uv run pytest \
            --cov=data_science \
            --cov-report=xml \
            --cov-report=term-missing
