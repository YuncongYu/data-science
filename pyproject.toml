[project]
authors = [{ name = "Yuncong Yu", email = "yuncong.yu@outlook.com" }]
dependencies = []
name = "data-science"
requires-python = ">= 3.11"
version = "0.1.0"
keywords = ["data science", "machine learning", "artificial intelligence", "statistics", "visual analytics"]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
data_science = { path = ".", editable = true }

[tool.pixi.tasks]
ci = { depends-on = ["lint", "test"]}

[tool.pixi.dependencies]
numpy = ">=2.4.1,<3"

[tool.pixi.feature.lint.dependencies]
ruff = "*"
mypy = "*"

[tool.pixi.feature.lint.tasks]
ruff = "ruff"
check = "ruff check ."
format = "ruff format ."
format-check = "ruff format --check ."

[tool.pixi.feature.test.dependencies]
pytest = "*"
pytest-cov = ">=7.0.0,<8"

[tool.pixi.feature.test.tasks]
test = "pytest"

[tool.pixi.environments]
dev = ["lint", "test"]

[tool.ruff]
line-length = 88
extend-exclude = [
    "experiments/homl/ch02*.ipynb", 
    "experiments/homl/ch03*.ipynb", 
    "experiments/homl/ch04*.ipynb",
    "experiments/homl/ch05*.ipynb",
    "experiments/homl/ch06*.ipynb",
    "experiments/homl/ch07*.ipynb",
    "experiments/homl/ch08*.ipynb",
    "experiments/homl/ch09*.ipynb",
    "experiments/homl/ch10*.ipynb",
]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

