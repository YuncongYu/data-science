[project]
authors = [{ name = "Yuncong Yu", email = "yuncong.yu@outlook.com" }]
dependencies = [
    "ipykernel>=7.3.0,<8",
    "jupyter>=1.1.1,<2",
    "matplotlib>=3.11.0,<4",
    "numpy>=2.5.1,<3",
    "pandas>=3.0.3,<4",
    "scikit-learn>=1.9.0,<2",
    "streamlit>=1.59.2,<2",
    "python-dotenv>=1.2.2,<2",
    "langchain-community>=0.4.2",
    "tiktoken>=0.13.0",
    "langchain-openai>=1.3.5",
    "langchainhub>=0.1.21",
    "chromadb>=1.5.9",
    "langchain>=1.3.14",
]
description = "A comprehensive data science project featuring machine learning experiments, statistical analysis, and AI implementations."
name = "data-science"
dynamic = ["version"]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">= 3.12"
keywords = [
    "data science",
    "machine learning",
    "artificial intelligence",
    "statistics",
    "visual analytics",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.optional-dependencies]
mcp = ["mcp[cli,mcp]>=1.28.1"]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[dependency-groups]
dev = [
    "data-science[mcp]",
    "ruff>=0.15.21,<0.16",
    "isort>=8.0.1,<9",
    "mypy>=2.3.0,<3",
    "pre-commit>=4.6.0,<5",
    "pandas-stubs>=3.0.3.260530,<4",
    "types-tqdm>=4.68.0.20260608,<5",
    "pytest>=9.1.1,<10",
    "pytest-cov>=7.1.0,<8",
]

[tool.ruff]
line-length = 88
extend-exclude = [
    "experiments/homl/ch02*.ipynb",
    "experiments/homl/ch03*.ipynb",
    "experiments/homl/ch04*.ipynb",
    "experiments/homl/ch05*.ipynb",
    "experiments/homl/ch06*.ipynb",
    "experiments/homl/ch07*.ipynb",
    "experiments/homl/ch08*.ipynb",
    "experiments/homl/ch09*.ipynb",
    "experiments/homl/ch10*.ipynb",
]

[tool.uv.sources]
data-science = { path = ".", editable = true }

[tool.mypy]
strict = true
ignore_missing_imports = true
exclude = [""]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
