repos:
# General checks (Whitespace, YAML, etc.)
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
    - id: trailing-whitespace
    - id: end-of-file-fixer
    - id: check-yaml
    - id: check-added-large-files
    - id: check-merge-conflict

# ruff: formatting, linting, and type checking
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.15.12
  hooks:
    - id: ruff-check
      args: [ --fix ]  # With --fix, ruff's formatter hook should be placed before black, isort, and other formatting tools
    - id: ruff-format

# isort: import sorting
- repo: https://github.com/pycqa/isort
  rev: 5.13.2
  hooks:
    - id: isort

# MyPy: type checking
- repo: https://github.com/pre-commit/mirrors-mypy
  rev: v1.20.2
  hooks:
    - id: mypy

# Bandit: security checking
- repo: https://github.com/PyCQA/bandit
  rev: 1.9.4
  hooks:
    - id: bandit
      args: ["-ll"]
      language: python
