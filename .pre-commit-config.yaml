repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff (lint)
        entry: pixi run -e dev ruff check --fix
        language: system
        types: [python]

      - id: ruff-format
        name: ruff (format)
        entry: pixi run -e dev ruff format
        language: system
        types: [python]
